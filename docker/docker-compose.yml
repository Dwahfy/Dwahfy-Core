# Run from this directory: docker compose --env-file ../.env up -d
# Or copy ex.env to .env at the repo root: cp ex.env .env

services:
  postgres:
    image: postgres:16
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dwahfy_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../scripts/db/postgres.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - dwahfy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwahfy_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  core:
    image: ghcr.io/dwahfy/dwahfy-core:latest
    restart: unless-stopped
    environment:
      PORT: 8000
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/dwahfy_prod
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    networks:
      - dwahfy
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # Replace with your own frontend image
    image: ${WEB_IMAGE:-your-dockerhub-user/your-web:latest}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://core:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - dwahfy
    depends_on:
      - core

networks:
  dwahfy:

volumes:
  postgres_data:
  uploads:
